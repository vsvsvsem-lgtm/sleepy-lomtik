<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6a6b8f">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌙%3C/text%3E%3C/svg%3E">
<title>Молочноломтиковые сны</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--ink:#46436a;--soft:#645f86;--light:#f6f0f6;--glass:rgba(255,255,255,.16);--edge:rgba(255,255,255,.38);--gold:#e9d6c8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;font-family:"Cormorant Garamond",Georgia,serif;color:var(--ink);
background:#8a85ab;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
z-index:-1;filter:blur(3px);transform:scale(1.04);background:linear-gradient(rgba(88,84,125,.26),rgba(88,84,125,.26)),var(--bg) center bottom/cover no-repeat}
#app{position:relative;max-width:480px;margin:0 auto;min-height:100%;padding:18px 22px 28px}
.moon{position:absolute;top:26px;right:34px;width:62px;height:62px;border-radius:50%;box-shadow:inset -14px 6px 0 0 #f4e6e8,0 0 28px rgba(250,235,235,.35);transform:rotate(-12deg)}
h1{font-weight:500;font-size:34px;line-height:1.1;margin:70px 0 10px;color:var(--light);max-width:260px}
.sub{color:rgba(240,234,244,.8);font-size:18px;max-width:320px;line-height:1.25;margin:0 0 28px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.3)}
.row{display:flex;gap:12px;justify-content:space-between;margin-top:34px}
.pill{flex:1;min-height:210px;border-radius:60px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:26px 8px 18px;color:var(--light);font:inherit;cursor:pointer;transition:transform .15s,background .3s}
.pill:active{transform:scale(.96)}
.pill.on{background:rgba(255,240,240,.34)}
.pill svg{width:44px;height:44px}
.pill b{font-weight:500;font-size:19px;text-align:center;line-height:1.1}
.pill small{display:block;font-size:14px;opacity:.85;min-height:16px;margin-top:4px;text-align:center;font-weight:400}
.go{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.28);display:grid;place-items:center;font-size:18px}
.wide{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;margin-top:30px;padding:18px;border-radius:40px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--light);font:inherit;font-size:21px;cursor:pointer}
.wide svg{width:26px;height:26px}
.top{display:flex;align-items:center;justify-content:space-between;height:44px}
.ib{background:none;border:0;color:var(--light);padding:6px;cursor:pointer;display:grid}
.ib svg{width:26px;height:26px}
h2{margin:0;font-weight:500;font-size:28px;color:var(--light)}
.list{margin-top:16px;display:flex;flex-direction:column;gap:12px;padding-bottom:84px}
.day{display:flex;gap:14px;padding:14px 16px;border-radius:26px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--light);font:inherit;text-align:left;cursor:pointer;width:100%}
.day .d{min-width:48px;text-align:center;font-size:30px;line-height:1}
.day .d small{display:block;font-size:14px;opacity:.8;margin-top:4px}
.day .t{flex:1;font-size:16px;line-height:1.3}
.day .t span{opacity:.75;font-size:14px;display:block;margin-top:5px}
.day .t span:first-child{margin-top:0}
.empty{margin-top:90px;text-align:center;color:var(--light);font-size:21px;opacity:.85}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(260px,70%);margin:0;background:rgba(190,175,205,.55)}
.arch{position:absolute;left:14px;right:14px;top:30px;bottom:0;border:1px solid rgba(255,255,255,.4);border-bottom:0;border-radius:260px 260px 0 0;pointer-events:none}
.dh{text-align:center;margin:66px 0 4px;font-size:42px;font-weight:500;color:var(--light);text-shadow:0 1px 12px rgba(70,64,110,.4)}
.ds{text-align:center;white-space:nowrap;letter-spacing:.08em;font-size:clamp(11px,3.5vw,15px);color:rgba(246,240,246,.88);text-shadow:0 1px 10px rgba(70,64,110,.4);padding-bottom:22px;margin-bottom:26px;border-bottom:1px solid rgba(246,240,246,.45);margin-left:8%;margin-right:8%}
.card{display:flex;align-items:center;gap:20px;padding:20px 22px;border-radius:44px;background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.55);margin:0 0 16px}
.card svg{width:48px;height:48px;color:var(--soft);flex:none}
.card h3{margin:0 0 4px;font-weight:500;font-size:21px;color:var(--soft)}
.card p{margin:0;font-size:30px;line-height:1.15;color:var(--ink)}
.card p.none{font-size:24px;opacity:.6}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-80px);background:rgba(255,248,250,.85);color:var(--ink);padding:10px 22px;border-radius:30px;font-size:18px;transition:transform .35s;z-index:9}
#toast.show{transform:translate(-50%,0)}
.tabs{display:flex;gap:8px;margin-top:10px}.tabs button{flex:1;padding:9px;border-radius:30px;border:1px solid var(--edge);background:var(--glass);color:var(--light);font:inherit;font-size:17px;cursor:pointer}.tabs .on{background:rgba(255,255,255,.72);color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:10px;text-align:center;color:var(--light);font-size:22px;margin-top:22px}.cal i{font-style:normal;font-size:17px;opacity:.8;margin-bottom:6px}.cd{width:44px;height:44px;margin:auto;border-radius:50%;display:grid;place-items:center;background:none;border:0;color:inherit;font:inherit}.cd.has{border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.2);cursor:pointer}.mt::first-letter{text-transform:uppercase}
#toast{width:max-content;max-width:88vw;text-align:center}.ib2{display:flex}.card>div:last-child{flex:1;min-width:0}.wr .pl{display:flex;flex-wrap:wrap;gap:0 18px}
.water{display:flex;align-items:center;gap:10px;margin:18px auto 0;padding:11px 26px;border-radius:30px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--light);font:inherit;font-size:19px;cursor:pointer;text-shadow:0 1px 10px rgba(70,64,110,.35)}.water svg{width:24px;height:24px}
.opts{display:flex;flex-direction:column;gap:14px;margin-top:26px}.opt{display:flex;align-items:center;gap:18px;padding:18px 26px;border-radius:40px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--light);font:inherit;font-size:22px;cursor:pointer;text-shadow:0 1px 10px rgba(70,64,110,.35)}.opt svg{width:34px;height:34px}
.fl{display:flex;flex-direction:column;gap:14px;margin-top:26px}.fl label{display:flex;flex-direction:column;gap:6px;color:var(--light);font-size:19px}.fl input{width:100%;font:inherit;font-size:22px;color:var(--light);background:var(--glass);border:1px solid var(--edge);border-radius:22px;padding:12px 18px;color-scheme:dark;outline:0}.lotus{position:absolute;top:30px;left:24px;width:50px;height:50px;color:var(--light);opacity:.92}.lotus svg{width:100%;height:100%}body{font-variant-numeric:lining-nums}.pill,.day,.wide,.tabs button{text-shadow:0 1px 10px rgba(70,64,110,.35)}
.card{position:relative}.card+.card{margin-top:32px}.card+.card::before{content:"\2726";position:absolute;top:-27px;left:50%;transform:translateX(-50%);color:var(--soft);font-size:17px}
.ok{text-align:center;margin-top:150px;color:var(--light)}.ck{width:120px;height:120px;border-radius:50%;margin:0 auto 26px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--edge)}
.card p[data-t]{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(60,55,90,.45);z-index:10}#modal.show{display:grid}.mb{background:rgba(245,236,244,.96);border-radius:30px;padding:24px 26px;text-align:center;color:var(--ink);font-size:20px;width:min(300px,84%)}.mb p{margin:0 0 18px}.mb b{font-size:28px;font-weight:500}.mb div{display:flex;gap:10px}.mb button{flex:1;padding:12px;border-radius:26px;border:1px solid rgba(53,51,79,.3);background:none;font:inherit;font-size:19px;color:var(--ink)}.mb button:first-child{background:#8683ad;color:#fff;border-color:transparent}
</style>
</head>
